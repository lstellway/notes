name: Set up
description: Install Node.js (version from .node-version), pnpm (version from package.json), and dependencies.

inputs:
  cache:
    description: >-
      Cache the pnpm store between runs ("true" or "false"). Leave it off in jobs that deploy,
      so a cache entry can never change what gets published.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
