# Deploys the public site when `main` changes. "Run workflow" on the Actions tab re-deploys
# the latest `main` (no inputs).
#
# The build runs without secrets. Only the deploy job uses the `production` environment,
# which holds the Cloudflare credentials and only accepts `main`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Several merges in a row collapse into one deploy of the newest `main`: a new run cancels
  # the one in progress. Cancelling is safe, because a deploy only switches production to a
  # new version once its upload has finished, and the newer run then deploys anyway.
  group: production
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, for each page's last-updated date.
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache, so a cache entry can't change what is published.
      - name: Set up
        uses: ./.github/actions/setup

      # Same checks as pull requests. The production build is part of `verify`.
      - name: Types, lint, tests, and production build
        run: pnpm verify

      - name: Save the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://guides.stellway.me
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-site
          path: dist

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --message "Deploy of $GITHUB_SHA"
